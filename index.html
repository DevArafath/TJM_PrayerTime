<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prayer Times</title>
<meta name="theme-color" content="#0a2e25">
<meta name="description" content="Daily prayer times with live countdown to adhan and iqamah.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1 id="mosque">Prayer Times</h1>
    <div id="clock" aria-label="Current time"></div>
    <div id="gdate"></div>
    <div id="hdate"></div>
    <div id="hdateAr" lang="ar" dir="rtl"></div>
  </header>
  <section id="hero" aria-live="off">
    <div id="label">Loading…</div>
    <div id="count"></div>
    <div id="sub"></div>
  </section>
  <section id="table">
    <div class="sched-title">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 21h20M6 21v-5a6 6 0 0 1 12 0v5M12 10V6M10.6 7.6h2.8M3.5 21V11l1.5-2 1.5 2v3M17.5 14v-3l1.5-2 1.5 2v10"/></svg>
      <span>Daily Prayer Schedule</span>
    </div>
    <div id="list"></div>
  </section>
  <p id="msg"></p>
</main>
<script src="app.js"></script>
</body>
</html>
